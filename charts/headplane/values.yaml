# Container image. Prefer pinned tags (kube-linter blocks :latest).
image:
  repository: ghcr.io/tale/headplane
  # renovate: datasource=docker depName=ghcr.io/tale/headplane
  tag: "0.7.1"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

# Recreate avoids Multi-Attach on RWO volumes during upgrades.
strategy:
  type: Recreate

serviceAccount:
  create: true
  automountServiceAccountToken: false
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 3000
  externalTrafficPolicy: ""
  annotations: {}

# Typically PathPrefix /admin on the same host as Headscale.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: headscale.example.org
      paths:
        - path: /admin
          pathType: Prefix
  tls: []

# Headplane config.yaml (non-secret). Secret paths are fixed to the mounted secret.
config:
  server:
    host: "0.0.0.0"
    port: 3000
    # Public URL without the /admin prefix.
    baseUrl: "https://headscale.example.org"
    cookieSecure: true
    cookieMaxAge: 86400
    dataPath: "/var/lib/headplane"
  headscale:
    # In-cluster Headscale HTTP service.
    url: "http://headscale:8080"
    publicUrl: "https://headscale.example.org"
    # Optional mount of Headscale's config for read-only UI display.
    configPath: "/etc/headscale/config.yaml"
  integration:
    agent:
      enabled: false
    docker:
      enabled: false
    kubernetes:
      enabled: false
    proc:
      enabled: false
  oidc:
    enabled: false
    issuer: ""
    clientId: "headplane"
    scope: "openid email profile"
    usePkce: true
    defaultRole: "member"

# Required when oidc.enabled or for server-side Headscale API access.
# Keys: cookieSecret (32 chars), apiKey, and clientSecret when oidc.enabled.
secrets:
  existingSecret: ""
  cookieSecretKey: cookieSecret
  apiKeyKey: apiKey
  clientSecretKey: clientSecret
  # Inline values only for non-GitOps smoke tests. Mutually exclusive with existingSecret.
  cookieSecret: ""
  apiKey: ""
  clientSecret: ""

# Mount Headscale config ConfigMap (optional, for config UI display).
headscaleConfig:
  existingConfigMap: ""
  key: config.yaml

persistence:
  enabled: true
  existingClaim: ""
  accessMode: ReadWriteOnce
  storageClass: ""
  size: 1Gi
  annotations: {}

resources: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

extraEnv: {}
extraVolumes: []
extraVolumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

startupProbe:
  httpGet:
    path: /admin
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /admin
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /admin
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
